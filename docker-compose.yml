# Starts PostgreSQL on localhost:5433 (the port used in the project reports).
# The default DATABASE_URL in backend/src/config.js already points here.
services:
  db:
    image: postgres:17
    container_name: smart-attendance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_attendance
    ports: ["5433:5432"]
    volumes: ["attendance-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_attendance"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  attendance-data:
